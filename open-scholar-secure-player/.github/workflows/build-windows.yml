# Open Scholar standard compliance

## Brand and interface

- Open Scholar deep-green palette retained.
- Original Open Scholar cap used.
- Dark headings on white or very light green.
- Mobile-first layout with no horizontal scrolling.
- SVG icons used in the header; no decorative icon clutter.
- Bordered interface elements use square corners.
- Advanced panels open from the right with a 10% top safe margin.
- Footer reads `Powered by OpenScholar.ng.`
- Product principle: extreme simplicity in front; complexity behind the interface.

## OS-STD-001 controls

- Tutorial post is created on first activation.
- Small, Medium and Big placement shortcodes are included and copyable.
- Public opening route and signed-in front-end owner route are separated.
- Owner route requires sign-in and `edit_posts`; Subscribers cannot create secure files.
- Import and export are the product's main workflow: source import, secure-file export, password-file export, recipient import.
- Settings and technical information are collapsed by default.
- SVG administration icon and front-end SVG controls are included.
- Tutorial and shortcodes are available on first activation.

## Existing phone shortcut

The plugin does not install a second phone application. `/secure-scholar/` is opened through the existing Open Scholar site and shortcut. `/secure-scholar/owner/` is the signed-in online preparation route.
