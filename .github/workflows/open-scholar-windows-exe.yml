name: Build Open Scholar Secure Player Windows EXE
on:
  workflow_dispatch:
  push:
    branches: ['claude/loving-maxwell-ny63r3']
    tags: ['open-scholar-secure-player-v*']
jobs:
  windows-exe:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: open-scholar-secure-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build browser application (verified inputs)
        run: python build.py
      - name: Build Windows executable and run its self-test
        shell: powershell
        run: .\desktop\Build_Secure_Scholar_EXE.ps1
      - name: Launch the real window and check it stays open
        shell: powershell
        working-directory: open-scholar-secure-player
        run: |
          $p = Start-Process -FilePath desktop\dist\OpenScholarSecurePlayer.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "The app closed early with exit code $($p.ExitCode)" }
          Write-Host "Window process $($p.Id) still running after 15 seconds"
          Stop-Process -Id $p.Id -Force
      - name: Write SHA-256 checksum
        shell: powershell
        run: |
          $exe = Get-Item desktop\dist\OpenScholarSecurePlayer.exe
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii desktop\dist\OpenScholarSecurePlayer.exe.sha256
          Get-Content desktop\dist\OpenScholarSecurePlayer.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OpenScholarSecurePlayer-Windows
          path: |
            open-scholar-secure-player/desktop/dist/OpenScholarSecurePlayer.exe
            open-scholar-secure-player/desktop/dist/OpenScholarSecurePlayer.exe.sha256
          if-no-files-found: error
