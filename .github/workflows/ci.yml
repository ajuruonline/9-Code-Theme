name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the upgrade test reads the old 3-package source from git history
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, zip, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: composer install --no-interaction
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: bin/lint.sh
      - name: Build zips
        run: bin/build.sh
      - name: Static audit (PHP compatibility, deprecated APIs)
        run: bin/audit.sh
      - name: Start test site
        run: bin/setup-test-site.sh && bin/serve-test-site.sh
      - name: Open Theme main.css computed corners (320px, 390px, desktop)
        run: node tests/e2e/open-theme-main-css-square-corners.mjs
      - name: Public site
        run: node tests/e2e/public.mjs
      - name: Admin crawl
        run: node tests/e2e/crawl.mjs
      - name: Post editor acceptance
        run: node tests/e2e/editor.mjs
      - name: Visual editor
        run: node tests/e2e/visual-editor.mjs
      - name: Data Manager integration environment (SCF, fixtures, partner plugins and apps when reachable)
        run: bin/setup-integration-env.sh
      - name: Data Manager integration suites
        run: tests/integration/run.sh
      - name: Data Workspace end-to-end (phone + desktop)
        run: node tests/e2e/data-workspace.mjs
      - name: WordPress Plugin Check
        run: bin/plugin-check.sh
      - name: Upgrade from the old 3-package install
        run: bin/test-upgrade.sh
      - name: Installed Open Theme WordPress acceptance (320/390/1280px)
        run: |
          set -euo pipefail
          ln -sfn "$PWD/theme-upload/open-theme-green-edition" "$PWD/.wp-test/wp/wp-content/themes/open-theme-green-edition"
          trap 'php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp theme activate nine-code >/dev/null || true' EXIT
          php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp theme activate open-theme-green-edition
          php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp option update show_on_front posts
          php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp post create --post_type=post --post_status=publish --post_name=open-theme-qa-card --post_title='Open Theme QA Card' --porcelain
          node tests/e2e/open-theme-installed-wordpress.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: installable-zips
          path: dist/*
