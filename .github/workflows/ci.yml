name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the upgrade test reads the old 3-package source from git history
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, zip, mbstring, gd
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: composer install --no-interaction
      - name: PHPCS advisory evidence regression (failing-first)
        run: python3 -m unittest discover -s tests/unit -p 'test_audit_reporting.py' -v
      - name: Plugin Check exception evidence regression (failing-first)
        run: python3 -m unittest discover -s tests/unit -p 'test_plugin_check_evidence.py' -v
      - run: npx playwright install --with-deps chromium
      - name: Lint
        run: bin/lint.sh
      - name: Build zips
        run: bin/build.sh
      - name: Static audit (PHP compatibility, deprecated APIs)
        run: bin/audit.sh
      - name: Start test site
        run: bin/setup-test-site.sh && bin/serve-test-site.sh
      - name: Header shortcode HTML output security gate (blocking assertions)
        run: php .wp-test/wp-cli.phar --allow-root --path=.wp-test/wp eval-file tests/e2e/header-shortcode-boundary.php
      - name: Header shortcode browser no-execution security gate
        run: node tests/e2e/header-shortcode-browser.mjs
      - name: Header settings role, capability and nonce security gate
        run: node tests/e2e/header-settings-auth.mjs
      - name: Public site
        run: node tests/e2e/public.mjs
      - name: Static front-page mode (320/390/1280px)
        run: node tests/e2e/static-front-page.mjs
      - name: Admin crawl
        run: node tests/e2e/crawl.mjs
      - name: Post editor acceptance
        run: node tests/e2e/editor.mjs
      - name: Visual editor
        run: node tests/e2e/visual-editor.mjs
      - name: WordPress Plugin Check
        run: bin/plugin-check.sh
      - name: Upgrade from the old 3-package install
        run: bin/test-upgrade.sh
      - uses: actions/upload-artifact@v4
        with:
          name: installable-zips
          path: dist/*
